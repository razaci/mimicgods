function help(){popup('Become what you conquer.','Move with <b>WASD / arrows</b>, the direction pad, or tap the ground. Tap a creature to select your target. <b>1</b> strikes the nearest enemy; three quick hits form a combo. <b>2</b> unleashes your power. <b>Space</b> dodges red attack circles. <b>Q</b> transforms instantly. <b>E</b> opens nearby treasure, shrines, gates, and secrets.<br><br>Defeat seven echoes to awaken a three-phase guardian. Explore each realm for treasure, prisoners, and hidden passages. Each realm now has a dungeon, a recovering village, and a roaming titan hunt. Open <b>Bonds</b> for companion training or <b>Expeditions</b> for dungeons, arena, and difficulty. Menus pause the world. Assist handles travel, attacks, powers, and dodging; you still choose gates and story decisions.',[{label:s.started?'Return to adventure':'Awaken the Mimic',action:()=>{s.started=true;notify('The vault calls. Your first hunt begins.')}}])}

function getLoot(rarity){let slot=['weapon','armor','relic'][Math.floor(Math.random()*3)],set=['Ash','Moon','Prism','Void'][s.realm],adjective=['Worn','Tempered','Radiant','Mythic'][rarity],name=adjective+' '+set+' '+(slot==='weapon'?['Fang','Spear','Claw'][Math.floor(Math.random()*3)]:slot==='armor'?'Mantle':'Sigil'),i={id:s.nextId++,name,slot,set,rarity,attack:slot==='weapon'?4+rarity*5+s.realm*2:slot==='relic'?2+rarity*2:0,health:slot==='armor'?22+rarity*20:slot==='relic'?10+rarity*7:0,heal:slot==='relic'?1+rarity:0};if(s.inventory.length>=60){s.shards+=3;notify('Inventory full: new relic converted into 3 shards.');return}s.inventory.push(i);if(s.equipped[slot]===null)s.equipped[slot]=i.id;notify('Found '+i.name+' · '+slot+'. Equip or salvage in Equipment.')}
function defeat(e){e.alive=false;e.hp=0;s.wins++;let coins=e.boss?110+s.realm*50:e.rival?50:13+s.realm*7;s.coins+=coins;s.shards+=e.boss?18:3;s.hp=Math.min(stats().hp,s.hp+stats().hp*.06);world.drops.push({x:e.x,y:e.y,type:'orb',value:10});tone(560,.18);if(!s.unlocked[e.form]){s.unlocked[e.form]=true;notify('NEW FORM CAPTURED: '+forms[e.form].name+'! Press Morph to transform.')}else notify(e.name+' conquered · +'+coins+' coins, +'+(e.boss?18:3)+' shards.');if(e.boss){s.done[s.realm]=true;s.unlocked[realms[s.realm].reward]=true;if(s.realm===3){s.unlocked[4]=true;finalChoice()}else popup('A god unmasked',e.name+' collapses into a thousand burning fragments. Beneath the crown, a prisoner opens their eyes. The eastern gate is now awake.<br><br>You claimed <b>'+forms[realms[s.realm].reward].name+'</b>, a mythic relic, and a mysterious egg.',[{label:'Take the stolen form. Walk onward.',action:()=>notify('Guardian conquered. Find the glowing eastern gate.')}]);getLoot(3);s.eggs++;particlesAt(e.x,e.y,'#ffe5af',60);shake=.7}else{if(Math.random()<.3||e.rival)getLoot(e.rival?2:Math.random()<.2?2:1);if(Math.random()<.12||e.rival)s.eggs++;if(e.rival&&s.realm===0&&!s.choices.first)storyChoice('first','Thorn lays down their mask. Your rival has spent centuries stealing weaker creatures to survive. They offer their last echo in exchange for mercy.')}save();sync()}

function finalChoice(){let mercy=Object.values(s.choices).filter(v=>v==='mercy').length,h=s.hybrids.length;popup('The vault has a heartbeat','The Empty God kneels. Inside its fractured chest, the stolen worlds turn like stars. '+(mercy?'The echoes you freed stand beside you. ':'The voices you absorbed speak with your voice. ')+(h?'Your '+h+' hybrid forms prove that creation can rise from ruin. ':'Your collected forms surround the fallen crown. ')+'<br><br>Will you release the worlds or claim their throne?',[{label:'Release the gods — the Dawnkeeper ending',action:()=>{s.choices.final='mercy';s.coins+=200;notify('DAWNKEEPER: the gods walk free. Your vault becomes a sanctuary.')}},{label:'Claim the throne — the Many-faced ending',action:()=>{s.choices.final='power';s.shards+=60;notify('MANY-FACED: you wear the final crown. The worlds answer your call.')}}])}
function hurt(n){if(t<invul)return;if(shield>0){shield=0;floating(s.x,s.y-55,'BLOCKED','#9df2df');tone(170);return}s.hp=Math.max(0,s.hp-n);floating(s.x,s.y-50,'−'+Math.round(n),'#ffb69f');particlesAt(s.x,s.y,'#ff9a95',10);shake=.14;tone(85,.15);invul=t+.35;if(s.hp<=0){s.hp=stats().hp*.65;s.x=220;s.y=820;target=null;world.enemies.forEach(e=>{e.wind=0;e.wait=t+2});popup('Your echo returns','The vault catches your fading form. You wake at the entrance with 65% vitality. Your coins, captured forms, treasure, and defeated enemies are safe.',[{label:'Continue the hunt',action:()=>notify('Returned to the entrance. A shrine can restore the rest of your vitality.')}]);save()}sync()}

function skillFor(id,factor=1){let a=stats().attack*factor,list=world.enemies.filter(e=>e.alive&&(!e.boss||e.special==='hunt'||bossOpen())&&distance(e,s)<(id===3||id===5?340:210));particlesAt(s.x,s.y,forms[id].color,32);if(id===0){for(let e of list)damage(e,a*1.7);s.hp=Math.min(stats().hp,s.hp+35*factor)}if(id===1){for(let e of list)damage(e,a*2.9);shake=.15}if(id===2){for(let e of list)damage(e,a*2.4);invul=t+.8}if(id===3){for(let e of list){e.stun=t+2;e.wind=0;damage(e,a*2);bolts.push({x:s.x,y:s.y-20,ex:e.x,ey:e.y-30,life:.4,color:forms[id].color})}}if(id===4){shield=1;for(let e of list){if(e.boss)e.armor=Math.max(0,e.armor-1);damage(e,a*2.2,true)}}if(id===5){for(let e of list)damage(e,a*3.1,true);s.hp=Math.min(stats().hp,s.hp+45*factor)}return list.length}
function power(){if(paused()||t<cool.power)return;cool.power=t+5;let h=s.activeHybrid>=0?s.hybrids[s.activeHybrid]:null;skillFor(s.form,h?.75:1);if(h)skillFor(h.b,.55);notify((h?hybridName(h)+' fusion':forms[s.form].skill)+' unleashed!');tone(510,.35);sync()}

function cycleForm(){if(paused())return;let unlocked=s.unlocked.map((v,i)=>v?i:-1).filter(i=>i>=0);let index=unlocked.indexOf(s.form);morph(unlocked[(index+1)%unlocked.length])}
function nearNode(){return world.nodes.filter(n=>!n.used||['gate','vault','shrine'].includes(n.type)).filter(n=>distance(s,n)<100).sort((a,b)=>distance(s,a)-distance(s,b))[0]}
function interact(){if(paused())return;let n=nearNode();if(!n){notify('Explore near a chest, shrine, prisoner, secret passage, or gate.');return}if(n.type==='vault'){openMenu('vault');return}if(n.type==='gate'){if(!s.done[s.realm]){notify('Defeat this realm’s guardian to open the gate.');return}if(s.realm<3){s.x=220;s.y=820;s.hp=stats().hp;enterRealm(s.realm+1);notify('Entered '+realms[s.realm].name+'. New creatures await.');save()}else openMenu('atlas');return}if(n.type==='shrine'){s.hp=stats().hp;notify('The shrine restores all vitality.');particlesAt(s.x,s.y,'#a0f6d5',35);tone(420,.3);save();sync();return}n.used=true;if(n.type==='chest'){s.chests++;s.coins+=35+s.realm*12;s.shards+=5;getLoot(Math.random()<.25?2:1);if(Math.random()<.35)s.eggs++;particlesAt(n.x,n.y,'#ffdc82',30)}if(n.type==='secret'){s.secrets++;s.eggs++;s.shards+=15;s.x=1180;s.y=230;notify('A hidden passage folds the world! +15 shards and a mysterious egg.');particlesAt(s.x,s.y,'#dcb3ff',40)}if(n.type==='captive'){s.shards+=10;if(!s.choices.second)storyChoice('second','A chained oracle offers a memory of the final god.');else{s.hp=stats().hp;notify('A captive echo is released. Vitality restored.')}}save();sync()}
function update(dt){t+=dt;let mx=(keys.right||keys.d?1:0)-(keys.left||keys.a?1:0),my=(keys.down||keys.s?1:0)-(keys.up||keys.w?1:0);near=nearNode();if(!mx&&!my&&target){let dx=target.x-s.x,dy=target.y-s.y,dist=Math.hypot(dx,dy);if(dist>9){mx=dx/dist;my=dy/dist}else target=null}
if(s.assist&&!mx&&!my){let e=nearestEnemy();if(e){let d=distance(e,s);if(d>110){mx=(e.x-s.x)/d;my=(e.y-s.y)/d}else{strike();power()}if(e.wind>0&&distance(s,{x:e.tx,y:e.ty})<e.radius+40){dir={x:(s.x-e.tx)||1,y:(s.y-e.ty)||0};let v=Math.hypot(dir.x,dir.y);dir.x/=v;dir.y/=v;dodge()}}else{let n=world.nodes.find(n=>['chest','secret','captive'].includes(n.type)&&!n.used);if(n){let d=distance(s,n);if(d<85)interact();else{mx=(n.x-s.x)/d;my=(n.y-s.y)/d}}}}
if(paused())return;let len=Math.hypot(mx,my);if(len){mx/=len;my/=len;dir={x:mx,y:my}}if(t<dash){mx=dir.x;my=dir.y}let speed=stats().speed*(t<dash?3:1),nx=clamp(s.x+mx*speed*dt,70,W-70),ny=clamp(s.y+my*speed*dt,85,H-70);const clear=(xx,yy)=>props.every(p=>Math.hypot(p.x-xx,p.y-yy)>p.size*.6);if(hasShape(1)||hasShape(5)||t<dash||clear(nx,ny)){s.x=nx;s.y=ny}else{let moved=false;if(target||s.assist){let a=Math.atan2(my,mx);for(let turn of [.8,-.8,1.57,-1.57,2.3,-2.3]){let xx=clamp(s.x+Math.cos(a+turn)*speed*dt,70,W-70),yy=clamp(s.y+Math.sin(a+turn)*speed*dt,85,H-70);if(clear(xx,yy)){s.x=xx;s.y=yy;moved=true;break}}if(s.assist&&t>=cool.dodge)dodge()}else if(clear(nx,s.y)){s.x=nx;moved=true}else if(clear(s.x,ny)){s.y=ny;moved=true}if(!moved)target=null;}
for(let e of world.enemies){if(!e.alive||e.boss&&e.special!=='hunt'&&!bossOpen()||e.stun>t)continue;let d=distance(e,s);if(e.boss&&d<500&&!bossAlerted){bossAlerted=true;notify(e.name+' awakens. Break its armor with Earthbreaker or pierce it with Eclipse.')}if(e.wind>0){e.wind-=dt;if(e.wind<=0){resolveAttack(e);e.wait=t+(e.boss?1.5:1.9)}continue}if(d<420+(e.boss?150:0)){let reach=e.boss?230:100;if(d>reach){let sp=e.rival?120:e.boss?65:e.form===2?100:70;e.x=clamp(e.x+(s.x-e.x)/d*sp*dt,40,W-40);e.y=clamp(e.y+(s.y-e.y)/d*sp*dt,50,H-50)}else if(t>=e.wait){e.wind=e.boss?.95:.75;e.tx=s.x;e.ty=s.y;e.radius=e.boss?80+e.phase*28:57;e.pattern=e.boss?e.phase:0;tone(e.boss?160:125,.1)}}}

function resolveAttack(e){particlesAt(e.tx,e.ty,'#ff936a',25);if(e.pattern===2){if(Math.abs(s.y-e.ty)<42&&Math.abs(s.x-e.tx)<310)hurt(e.atk);else if(distance(s,{x:e.tx,y:e.ty})<e.radius)hurt(e.atk)}else if(e.pattern===3){let d=distance(s,{x:e.tx,y:e.ty});if(d<e.radius||d>e.radius+65&&d<e.radius+112)hurt(e.atk*1.3);for(let n of world.enemies.filter(n=>n.alive&&!n.boss).slice(0,2))n.stun=0}else if(distance(s,{x:e.tx,y:e.ty})<e.radius)hurt(e.atk);if(e.boss)shake=.25}

$('content').onclick=e=>{let b=e.target.closest('[data-act]');if(!b||b.disabled)return;let [a,v]=b.dataset.act.split(':'),id=Number(v);if(a==='form')morph(id);if(a==='hybrid')morph(s.hybrids[id].a,id);if(a==='companion'){s.companion=id;notify(forms[id].name+' now travels beside you.')}if(a==='dismiss')s.companion=-1;if(a==='travel'){if(id>0&&!s.done[id-1])return;s.x=220;s.y=820;enterRealm(id);closeMenu();notify('Traveled to '+realms[id].name+'.')}if(a==='replay'){if(!s.done[id]||!confirm('Regenerate this realm’s enemies and treasure? Your collection and campaign progress stay saved.'))return;s.worlds[id]=makeWorld(id);s.x=220;s.y=820;enterRealm(id);closeMenu();notify('The realm renews. Hunt again for more treasure.')}if(a==='fuse'){let aa=+$('hybridA').value,bb=+$('hybridB').value;if(aa===bb){notify('Choose two different forms.');return}if(s.hybrids.some(h=>h.a===aa&&h.b===bb||h.a===bb&&h.b===aa)){notify('That hybrid already lives in your vault.');return}if(s.shards<20)return;s.shards-=20;s.hybrids.push({a:aa,b:bb});morph(aa,s.hybrids.length-1);notify(hybridName(s.hybrids.at(-1))+' is born.')}if(a==='evolve'){let lv=s.levels[s.form],coins=50+lv*45,shards=8+lv*5;if(lv>=5||s.coins<coins||s.shards<shards)return;s.coins-=coins;s.shards-=shards;s.levels[s.form]++;s.hp=stats().hp;notify('Evolution complete. Attack and health increased.');tone(720,.4)}if(a==='craft'){if(s.shards<18)return;s.shards-=18;getLoot(Math.random()<.25?3:2)}if(a==='vault')openMenu('vault');if(a==='room'){let cost=50+s.rooms[v]*60;if(s.rooms[v]>=5||s.coins<cost)return;s.coins-=cost;s.rooms[v]++;notify(v+' expanded. The vault grows.')}if(a==='heal'){s.hp=stats().hp;notify('Vault vitality fully restored.')}if(a==='hatch'){if(s.eggs<1)return;s.eggs--;s.hatched++;let rare=Math.random()<.12+s.rooms.nursery*.1,unowned=s.unlocked.map((val,i)=>!val&&i<5?i:-1).filter(i=>i>=0);if(rare&&unowned.length){let id=unowned[Math.floor(Math.random()*unowned.length)];s.unlocked[id]=true;notify('RARE HATCH: '+forms[id]. const fusionTitles={'0:1':'Cinder Maw','0:2':'Lunar Hunger','0:3':'Dream Eater','0:4':'Living Fortress','0:5':'Endless Appetite','1:2':'Wildfire Hunt','1:3':'Glassfire Cascade','1:4':'Molten Bastion','1:5':'Burning Eclipse','2:3':'Starlit Pack','2:4':'Iron Howl','2:5':'Nightfall Pursuit','3:4':'Crystal Siege','3:5':'Heavenless Light','4:5':'Worldbreaker'};
function fusionTitle(h){return fusionTitles[[h.a,h.b].sort((a,b)=>a-b).join(':')]}
const fusionPower=power;power=function(){let old=cool.power;fusionPower();if(cool.power===old||s.activeHybrid<0)return;let h=s.hybrids[s.activeHybrid],dna=h.a*6+h.b,count=3+dna%5;for(let i=0;i<count;i++){let angle=i*Math.PI*2/count+animClock;bolts.push({x:s.x,y:s.y-25,ex:s.x+Math.cos(angle)*170,ey:s.y-25+Math.sin(angle)*130,life:.4,color:forms[h.b].color})}floating(s.x,s.y-85,fusionTitle(h),forms[h.b].color);if([h.a,h.b].includes(2))cool.dodge=Math.min(cool.dodge,t);if([h.a,h.b].includes(4))shield=1;notify(fusionTitle(h)+' — '+forms[h.a].skill+' and '+forms[h.b].skill+' merge!')};
const characterTone=tone;tone=function(freq,d=.12,type='sine'){let waves=['sine','triangle','sine','sine','triangle','sawtooth'];characterTone(freq*(1+s.form*.075),d,type==='sine'?waves[s.form]:type)};

resize();enterRealm(s.realm);notify(message);if(!s.started)help();requestAnimationFrame(frame);
